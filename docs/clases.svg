<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 1810" role="img" aria-labelledby="title desc">
<title id="title">RF03: UML de clases</title><desc id="desc">Referencias con visibilidad, multiplicidad y readOnly. Cuatro subclases del Handler abstracto; servicios simulados.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#66418b" stroke-width="1.5"/></marker><marker id="inherit" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M1 1 L14 7 L1 13 Z" fill="white" stroke="#66418b" stroke-width="1.5"/></marker></defs>
<rect width="1460" height="1810" fill="#faf8fe"/>
<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#30213f}.title{font-size:21px;font-weight:700}.member{font-size:14px}.role{font-size:13px;fill:#6b4b88}.edge{fill:none;stroke:#66418b;stroke-width:2}</style>
<text x="35" y="38" class="title" >RF03 · UML de clases</text>
<text x="35" y="65" class="role" >Referencias solo como atributos: visibilidad, multiplicidad y {readOnly}. Sin asociaciones duplicadas.</text>
<path data-subclass="AuditoriaMiddleware" d="M195.0 450 V410 H722 V350" class="edge" marker-end="url(#inherit)"/>
<path data-subclass="AutenticacionMiddleware" d="M547.5 450 V410 H722 V350" class="edge" marker-end="url(#inherit)"/>
