</g>
<g data-class="FragmentosFuente">
<rect x="975" y="1430" width="445" height="116" rx="6" fill="white" stroke="#b9a6cd"/>
<rect x="975" y="1430" width="445" height="70" rx="6" fill="#eee5fa"/>
<text x="987" y="1457" class="title" style="font-size:19px">FragmentosFuente</text>
<text x="987" y="1480" class="role" >Utilidad de documentación</text>
<text x="987" y="1522" class="member" >{static} + leer(clase: String, clave: String): String</text>
</g>
<text x="35" y="1730" class="role" >Triángulo vacío = herencia; línea discontinua = dependencia. Constructores, getters y records anidados abreviados.</text>
<text x="35" y="1756" class="role" >El sucesor se fija mediante constructor; no hay setters. Terminal: siguiente = null.</text>
<text x="35" y="1782" class="role" >Servicios y almacenamiento simulados; no representan seguridad de producción.</text>
</svg>
