<path data-subclass="RadicarPropuestaHandler" d="M1260.0 450 V410 H722 V350" class="edge" marker-end="url(#inherit)"/>
<path d="M1000 275 H965 V320 H940" class="edge" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="1030" y="405" class="role" >Construye y compone la cadena</text>
<text x="35" y="695" class="title" >Servicios referenciados por los manejadores · todos simulados</text>
<text x="35" y="1060" class="title" >Contexto, respuesta y apoyo · tipos reales del proyecto</text>
