<text x="30" y="1994" class="role" >Escenarios con título válido. Se omite la instrumentación de la traza. Auditoría registra respuestas normales 401, 403 y 200; este diagrama no representa excepciones</text>
<text x="30" y="2019" class="role" >inesperadas.</text>
<text x="30" y="2066" class="role" >Llamadas: líneas continuas. Retornos: líneas discontinuas. Getters simples, constructores e instrumentación omitidos.</text>
<text x="30" y="2096" class="role" >Entre manejadores, continuar(solicitud) invoca procesar del sucesor. Validación de título → 400 ocurre antes de la cadena.</text>
